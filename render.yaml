# Render Blueprint: New > Blueprint > pick this repo, or use the "Deploy to Render" button in README.md
services:
  - type: web
    name: bazaario
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: ADMIN_EMAIL
        sync: false   # Render asks you for this when you create the service
      - key: ADMIN_PASSWORD
        sync: false
