{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="card" style="max-width:520px"><div class="card-body">
<form method="post" novalidate>{% csrf_token %}
  {% for field in form %}{% include "partials/_field.html" %}{% endfor %}
  <button class="btn btn-primary">Update password</button>
</form>
</div></div>
<script>document.querySelectorAll("input[type=password]").forEach(i => i.classList.add("form-control"));</script>
{% endblock %}
