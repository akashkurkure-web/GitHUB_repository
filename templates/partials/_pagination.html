{% if page.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-between align-items-center px-3 py-2 border-top small">
  <span class="text-muted">Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{{ querystring }}{% if querystring %}&{% endif %}page={{ page.previous_page_number }}">‹</a></li>{% endif %}
    <li class="page-item active"><span class="page-link">{{ page.number }} / {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{{ querystring }}{% if querystring %}&{% endif %}page={{ page.next_page_number }}">›</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
