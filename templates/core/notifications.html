{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Notifications</h1></div>
<form method="post" action="{% url 'core:notifications_read' %}">{% csrf_token %}<button class="btn btn-light border">Mark all read</button></form></div>
<div class="card"><div class="list-group list-group-flush">
{% for n in items %}<a href="{{ n.link|default:'#' }}" class="list-group-item list-group-item-action {% if not n.is_read %}fw-semibold{% endif %}"><div class="d-flex justify-content-between"><span>{{ n.title }}</span><small class="text-muted">{{ n.created_at|timesince }} ago</small></div><div class="small text-muted fw-normal">{{ n.message }}</div></a>
{% empty %}<div class="empty"><i class="bi bi-bell-slash"></i>No notifications yet.</div>{% endfor %}
</div></div>
{% endblock %}
